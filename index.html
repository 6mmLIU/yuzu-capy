<!DOCTYPE html>
<html lang="en">
<!-- 入口 src/boot.js → src/main.js，挂载点 #app。Telegram Mini App 版。 -->
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yuzu Capy Strike</title>
    <!-- Telegram Mini App 接口：必须在游戏脚本之前加载 -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <style>
        :root {
            --pm-safe-top: 0px;
            --pm-safe-right: 0px;
            --pm-safe-bottom: 0px;
            --pm-safe-left: 0px;
            --ink: #4a3524;
            --paper: #fdf6e6;
            --paper2: #f1e7cf;
            --muted: #8a7257;
            --orange: #ff9a2e;
            --gem: #7fd0f5;
            --green: #8fd66b;
            --red: #ff7d68;
        }
        @supports (padding: env(safe-area-inset-bottom, 0px)) {
            :root {
                --pm-safe-top: env(safe-area-inset-top, 0px);
                --pm-safe-right: env(safe-area-inset-right, 0px);
                --pm-safe-bottom: env(safe-area-inset-bottom, 0px);
                --pm-safe-left: env(safe-area-inset-left, 0px);
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #3a2c20;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            color: #4a3524;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        #app {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: #3a2c20;
        }
        .game-shell {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #3a2c20;
            touch-action: none;
        }
        .game-canvas {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            z-index: 0;
        }
        .game-column {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            pointer-events: none;
            z-index: 2;
        }
        .hud-root {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        .hud-root[hidden] {
            display: none;
        }
        .hud-top {
            position: absolute;
            left: 14px;
            right: 14px;
            top: calc(var(--pm-safe-top) + 10px);
            height: 30px;
            display: flex;
            align-items: center;
        }
        .hud-capsule {
            height: 30px;
            border: 3px solid var(--ink);
            border-radius: 15px;
            background: #fffdf6;
            box-shadow: 0 3px 0 rgba(74, 53, 36, 0.35);
            display: flex;
            align-items: center;
            padding: 0 8px 0 3px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 800;
            line-height: 1;
        }
        .hud-capsule--orange {
            min-width: 84px;
        }
        .hud-capsule--gem {
            min-width: 62px;
            margin-left: 9px;
        }
        .hud-capsule__icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            margin-right: 3px;
            transform: rotate(-8deg);
            flex: 0 0 auto;
        }
        .hud-capsule__text {
            white-space: nowrap;
        }
        .hud-capsule.is-pulsing {
            animation: hud-pop 0.24s ease-out;
        }
        .hud-progress {
            position: relative;
            flex: 1 1 auto;
            height: 30px;
            margin-left: 9px;
            border: 3px solid var(--ink);
            border-radius: 15px;
            background: #fffdf6;
            box-shadow: 0 3px 0 rgba(74, 53, 36, 0.35);
            overflow: hidden;
        }
        .hud-progress__fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: #b9e79f;
            border-radius: 12px;
            transition: width 0.12s linear;
        }
        .hud-progress.is-full .hud-progress__fill {
            background: #8fd66b;
        }
        .hud-progress__label {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 24px;
            line-height: 24px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink),
                1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink);
        }
        .hud-upgrades {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: calc(var(--pm-safe-bottom) + 8px);
            display: flex;
            pointer-events: auto;
        }
        .hud-card {
            position: relative;
            width: calc((100% - 21px) / 4);
            height: 96px;
            margin-right: 7px;
            border: 0;
            border-radius: 17px;
            box-shadow: inset 0 0 0 3px var(--ink), 0 4px 0 rgba(74, 53, 36, 0.35);
            padding: 0;
            font-family: inherit;
            color: #fff;
            text-align: center;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.08s ease;
            overflow: visible;
            outline: none;
        }
        .hud-card:last-child {
            margin-right: 0;
        }
        .hud-card::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -8px;
            height: 104px;
        }
        .hud-card.is-pressing {
            transform: scale(0.94) translateY(2px);
        }
        .hud-card__icon {
            position: absolute;
            left: -6px;
            top: -16px;
            width: 36px;
            height: 36px;
            object-fit: contain;
            transform: rotate(-0.17rad);
            z-index: 2;
            pointer-events: none;
        }
        .hud-card__name {
            position: absolute;
            left: 16px;
            right: 0;
            top: 16px;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 800;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
        }
        .hud-card__level {
            position: absolute;
            right: 14px;
            top: -3px;
            transform: translate(50%, -50%);
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink);
            z-index: 3;
        }
        .hud-card__value {
            position: absolute;
            left: 0;
            right: 0;
            top: 43px;
            transform: translateY(-50%);
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink),
                1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink);
            z-index: 1;
        }
        .hud-card__cost {
            position: absolute;
            left: 6px;
            right: 6px;
            top: 66px;
            height: 23px;
            border-radius: 11.5px;
            background: var(--ink);
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            z-index: 1;
        }
        .hud-card__orange {
            position: absolute;
            left: -3px;
            top: -2px;
            width: 24px;
            height: 24px;
            object-fit: contain;
            z-index: 2;
        }
        .hud-card__costText {
            position: absolute;
            left: 50%;
            top: 12px;
            transform: translate(9px, -50%);
            white-space: nowrap;
            z-index: 1;
        }
        .hud-card.is-maxed .hud-card__cost {
            background: rgb(95, 174, 69);
        }
        .hud-card.is-maxed .hud-card__costText {
            transform: translate(0, -50%);
            font-size: 12px;
        }
        .hud-card__costText.is-poor {
            color: rgb(255, 179, 166);
        }
        .hud-walk {
            position: absolute;
            left: 0;
            right: 0;
            top: 55%;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink),
                1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink);
        }
        .hud-walk[hidden] {
            display: none;
        }
        .hud-toasts {
            position: absolute;
            left: 12px;
            right: 12px;
            top: calc(var(--pm-safe-top) + 50px);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .hud-toast {
            max-width: 100%;
            margin-top: 6px;
            padding: 7px 14px;
            border: 3px solid var(--ink);
            border-radius: 15px;
            background: #fffdf6;
            color: var(--ink);
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 3px 0 rgba(74, 53, 36, 0.35);
            display: flex;
            align-items: center;
            animation: hud-toast-in 0.18s ease-out;
        }
        .hud-toast__icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            margin-right: 6px;
        }
        @keyframes hud-toast-in {
            from { opacity: 0; transform: translateY(-8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes hud-pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .boot-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgb(201, 230, 164);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .boot-overlay[hidden] {
            display: none;
        }
        .boot-title {
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(74, 53, 36, 0.5), 1px 1px 0 rgba(74, 53, 36, 0.3);
        }
        .boot-bar {
            width: 240px;
            max-width: 60%;
            height: 16px;
            margin-top: 30px;
            border: 3px solid var(--ink);
            border-radius: 10px;
            background: #fff8e1;
            box-shadow: 0 3px 0 rgba(74, 53, 36, 0.35);
            padding: 3px;
        }
        .boot-fill {
            width: 6%;
            height: 100%;
            background: #ffa73c;
            border-radius: 5px;
            transition: width 0.12s linear;
        }
        .boot-hint {
            margin-top: 12px;
            color: #fffdf6;
            font-size: 12px;
            text-shadow: 0 1px 0 rgba(74, 53, 36, 0.4);
        }
        .boot-error {
            margin-top: 18px;
            max-width: 80%;
            color: #fff;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
            text-shadow: 0 1px 0 rgba(74, 53, 36, 0.5);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div id="app"></div>
<!-- 原生 ES modules；boot.js 先读取配置，再初始化游戏 -->
<script>window.__PM_BUILD_ID__="202611221537";</script>
<script type="module" src="./v202611221537/src/boot.js"></script>
</body>
</html>
